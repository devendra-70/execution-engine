version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeval-postgres
    environment:
      POSTGRES_DB: codeval
      POSTGRES_USER: codeval
      POSTGRES_PASSWORD: codeval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeval"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeval-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: codeval-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: codeval-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for inter-container (INTERNAL) and one for host access (EXTERNAL)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://codeval-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "codeval-kafka:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Build the sandbox-wrapper image so DockerContainerPool can pull it ───
  sandbox-wrapper-build:
    build:
      context: .
      dockerfile: sandbox-wrapper/Dockerfile
    image: codeval/sandbox-wrapper:latest   # tags the built image with this name
    command: ["true"]                        # exits immediately after build/tag
    profiles:
      - build                               # only runs when: docker compose --profile build up

  execution-engine:
    build:
      context: .
      dockerfile: execution-engine-app/Dockerfile
    container_name: codeval-execution-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: codeval
      DB_USER: codeval
      DB_PASS: codeval
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: codeval-kafka:29092
      JWT_SECRET: changeme-very-long-secret-key-for-dev-only-32chars
      # Rancher Desktop (CE:moby) uses Docker socket
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_IMAGE: codeval/sandbox-wrapper:latest
      # From inside the container, reach host-mapped sandbox ports via host.docker.internal
      SANDBOX_HOST: host.docker.internal
      # Pool size: number of sandbox containers pre-warmed on startup
      APP_EXECUTION_POOL_WARM_MIN_SIZE: 10
    volumes:
      # Mount Docker socket so engine can spawn sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    # Ensures host.docker.internal resolves on Linux (automatic on Docker Desktop Win/Mac)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
