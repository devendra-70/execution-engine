server:
  port: 8080

app:
  jwt:
    secret-key: ${JWT_SECRET:changeme-very-long-secret-key-for-dev-only-32chars}

  kafka:
    topic: execution-tasks
    partitions: 50
    concurrency: 25

  execution:
    orchestration-threads: 50
    timeout-ms: 3000
    pool:
      warm-min-size: 5
      idle-ttl-seconds: 300
    sandbox:
      memory-limit-mb: 256
      jvm-xms: 128m
      jvm-xmx: 256m

  redis:
    status-ttl-seconds: 600
    rate-limit:
      requests-per-minute: 5

  cache:
    testcase-ttl-minutes: 60

  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    sandbox-image: ${SANDBOX_IMAGE:codeval/sandbox-wrapper:latest}
    sandbox-host: ${SANDBOX_HOST:localhost}   # Host used by engine to reach sandbox containers

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codeval}
    username: ${DB_USER:codeval}
    password: ${DB_PASS:codeval}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.codeval: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO

