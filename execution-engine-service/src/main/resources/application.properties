spring.application.name=executionEngine-service


# ===============================
# = RATE LIMITING CONFIGURATION (SRS Section 3.5)
# ===============================
# Default: 30 requests per minute per user (from SRS Section 3.5)
app.rate-limit.requests-per-minute=30
app.rate-limit.window-seconds=60

# ===============================
# = EXECUTION ENGINE CONFIGURATION (SRS Section 14.1)
# ===============================
# Execution status TTL in Redis: 10 minutes (600 seconds)
app.execution.status-ttl-seconds=600
app.execution.orchestration-threads=10

# ===============================
# = SERVER CONFIGURATION (SRS Section 14.1)
# ===============================
server.port=8080

# ===============================
# = DATABASE CONFIGURATION (PostgreSQL)
# = SECURITY / OAuth2 JWT CONFIGURATION (SRS Section 3.6)
# ===============================
# EPMICMPCOD-461: PostgreSQL database for persistence
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:execution_engine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Spring Security OAuth2 Resource Server with JWT validation
# JWT tokens are validated against the configured issuer URI
# Invalid or missing tokens result in 401 Unauthorized

# For production: configure with your actual OAuth2 provider
# For testing: using Google's public JWKS endpoint
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
# EPMICMPCOD-459, EPMICMPCOD-461: JPA batch configuration (SRS §12)
# ddl-auto=validate: schema already exists (Flyway creates it)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate batch insert configuration (SRS §12, EPMICMPCOD-461)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Hibernate statement caching
spring.jpa.properties.hibernate.generate_statistics=false

# ===============================
# = DATABASE MIGRATION (Flyway)
# ===============================
# EPMICMPCOD-461: Flyway manages schema migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# = KAFKA CONFIGURATION (SRS §5.2)
# ===============================
# Manual ACK mode: offset NOT acknowledged until DB commit succeeds
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=execution-engine-consumer-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=executionResultEvent:com.epam.execution_engine_service.persistence.event.ExecutionResultEvent

# Producer for publishing (if needed)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# = REDIS CONFIGURATION (SRS §8)
# ===============================
# Redis cache for execution results (KV pattern and Pub/Sub)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms

# ===============================
# = APPLICATION CONFIGURATION
# ===============================
# Redis TTL for execution:status:{executionId} cache (SRS §8, §12)
app.redis.status-ttl-seconds=${APP_REDIS_STATUS_TTL_SECONDS:600}

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.epam.execution_engine_service=DEBUG

# ===============================
# = HEALTH PROBE CONFIGURATION (EPMICMPCOD-522, SRS §3.2)
# ===============================
# Kafka health indicator configuration
# - Enable Kafka connectivity checks in /actuator/health endpoint
app.health.kafka.lag-check-enabled=true
# - Interval between health checks (seconds)
app.health.kafka.check-interval-seconds=30
# - Kafka consumer lag threshold for health determination (records)
#   If lag exceeds this value, health status is DOWN
app.health.kafka.lag-threshold-for-health-records=50000

# ===============================
# = METRICS CONFIGURATION (EPMICMPCOD-525, SRS §12)
# ===============================
# Master toggle for all operational metrics
app.metrics.enabled=true

# --- Signal 1: Kafka Consumer Lag (SRS §11.2, §12) ---
# Threshold: if lag > this value, trigger auto-scaling
app.metrics.kafka.lag-threshold-records=1000
# Interval for checking Kafka lag metrics (seconds)
app.metrics.kafka.lag-check-interval-seconds=60

# --- Signal 2: CPU Utilization (SRS §11.2) ---
# CPU threshold (percent) for auto-scaling trigger
# If process.cpu.usage > this value, trigger scale-up
app.metrics.cpu.threshold-percent=70

# --- Signal 3: Health Check Failure Rate (SRS §12) ---
# Threshold: if non-2xx response rate > this percent, trigger alarm
app.metrics.health-check.failure-rate-threshold-percent=10
# Time window for calculating failure rate (seconds)
app.metrics.health-check.window-seconds=300

# --- Signal 4: DB Write Failure Rate (SRS §12) ---
# Threshold: if DataAccessException count > this in window, trigger alarm
app.metrics.persistence.failure-rate-threshold-count=5
# Time window for counting persistence failures (seconds)
app.metrics.persistence.window-seconds=60

# --- Signal 5: Sandbox Pool Exhaustion (SRS §12) ---
# Threshold: if available_size < (warm_min_size × this percent), trigger alarm
app.metrics.sandbox-pool.exhaustion-threshold-percent=20

# --- Signal 6: Execution Latency (SRS §12) ---
# Threshold: if p95 latency > this value (milliseconds), monitor closely
app.metrics.execution.p95-latency-ms-threshold=5000
# Threshold: if p99 latency > this value (milliseconds), trigger scale-up alarm
app.metrics.execution.p99-latency-ms-threshold=3000

# ===============================
# = ACTUATOR / PROMETHEUS CONFIGURATION
# ===============================
# Expose health and metrics endpoints for CloudWatch and monitoring
management.endpoints.web.exposure.include=health,prometheus,metrics,info
# Detailed health information for dependencies
management.endpoint.health.show-details=when-authorized
# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true
# Enable JVM metrics (process, JVM, memory, GC)
management.metrics.enable.jvm=true
# Enable process metrics (CPU, memory)
management.metrics.enable.process=true
# Enable Kafka consumer metrics
management.metrics.enable.kafka=true
# Prometheus scrape interval (default)
management.metrics.export.prometheus.step=1m
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.data=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ===============================
# = SANDBOX RUNTIME ISOLATION (EPMICMPCOD-349)
# ===============================
# Subtask 451: JVM Configuration
app.execution.sandbox.jvm-xms=128m
app.execution.sandbox.jvm-xmx=256m
app.execution.sandbox.jvm-tiered-stop-level=1
app.execution.sandbox.jvm-use-epsilon-gc=true
app.execution.sandbox.jvm-shared-archive-file=/sandbox/shared.jsa
app.execution.sandbox.jvm-always-pre-touch=true
app.execution.sandbox.jvm-thread-stack-kb=256

# Subtask 457: Resource Limits
app.execution.sandbox.memory-limit-mb=288
app.execution.sandbox.cpu-limit-millis=1000
app.execution.sandbox.pid-limit=512