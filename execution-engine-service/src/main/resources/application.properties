spring.application.name=executionEngine-service

# ===============================
# = REDIS CONFIGURATION (SRS Section 8)
# ===============================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=2000
spring.redis.jedis.pool.max-active=20
spring.redis.jedis.pool.max-idle=10
spring.redis.jedis.pool.min-idle=5

# Application-specific Redis settings
app.redis.status-ttl-seconds=600

# ===============================
# = KAFKA CONFIGURATION (SRS Section 7)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Application-specific Kafka settings (SRS Section 14.1)
app.kafka.topic=execution-tasks
app.kafka.partitions=3
app.kafka.concurrency=3

# ===============================
# = RATE LIMITING CONFIGURATION (SRS Section 3.5)
# ===============================
# Default: 30 requests per minute per user (from SRS Section 3.5)
app.rate-limit.requests-per-minute=30
app.rate-limit.window-seconds=60

# ===============================
# = EXECUTION ENGINE CONFIGURATION (SRS Section 14.1)
# ===============================
# Execution status TTL in Redis: 10 minutes (600 seconds)
app.execution.status-ttl-seconds=600
app.execution.orchestration-threads=10

# ===============================
# = SERVER CONFIGURATION (SRS Section 14.1)
# ===============================
server.port=8080

# ===============================
# = SECURITY / OAuth2 JWT CONFIGURATION (SRS Section 3.6)
# ===============================
# Spring Security OAuth2 Resource Server with JWT validation
# JWT tokens are validated against the configured issuer URI
# Invalid or missing tokens result in 401 Unauthorized

# For production: configure with your actual OAuth2 provider
# For testing: using Google's public JWKS endpoint
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
# Disabled for now - no direct database access in api-gateway-service
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
