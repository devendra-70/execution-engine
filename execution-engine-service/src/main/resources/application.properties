spring.application.name=executionEngine-service

# ===============================
# = REDIS CONFIGURATION
# ===============================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=2000
spring.redis.jedis.pool.max-active=20
spring.redis.jedis.pool.max-idle=10
spring.redis.jedis.pool.min-idle=5

# Application-specific Redis settings
app.redis.status-ttl-seconds=600

# ===============================
# = KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Application-specific Kafka settings
app.kafka.topic=execution-tasks
app.kafka.partitions=3
app.kafka.concurrency=3

# ===============================
# = JWT CONFIGURATION
# ===============================
app.jwt.secret-key=your-secret-key-change-in-production-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=3600000

# ===============================
# = RATE LIMITING CONFIGURATION
# ===============================
app.rate-limit.requests-per-minute=5
app.rate-limit.window-seconds=60

# ===============================
# = EXECUTION ENGINE CONFIGURATION
# ===============================
app.execution.orchestration-threads=10

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = JPA / HIBERNATE CONFIGURATION (Disabled for now)
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration