spring.application.name=executionEngine-service

# ===============================
# = DATABASE CONFIGURATION (PostgreSQL)
# ===============================
# EPMICMPCOD-461: PostgreSQL database for persistence
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:execution_engine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
# EPMICMPCOD-459, EPMICMPCOD-461: JPA batch configuration (SRS §12)
# ddl-auto=validate: schema already exists (Flyway creates it)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate batch insert configuration (SRS §12, EPMICMPCOD-461)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Hibernate statement caching
spring.jpa.properties.hibernate.generate_statistics=false

# ===============================
# = DATABASE MIGRATION (Flyway)
# ===============================
# EPMICMPCOD-461: Flyway manages schema migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# = KAFKA CONFIGURATION (SRS §5.2)
# ===============================
# Manual ACK mode: offset NOT acknowledged until DB commit succeeds
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=execution-engine-consumer-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=executionResultEvent:com.epam.execution_engine_service.persistence.event.ExecutionResultEvent

# Producer for publishing (if needed)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# = REDIS CONFIGURATION (SRS §8)
# ===============================
# Redis cache for execution results (KV pattern and Pub/Sub)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms

# ===============================
# = APPLICATION CONFIGURATION
# ===============================
# Redis TTL for execution:status:{executionId} cache (SRS §8, §12)
app.redis.status-ttl-seconds=${APP_REDIS_STATUS_TTL_SECONDS:600}

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.epam.execution_engine_service=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.data=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n