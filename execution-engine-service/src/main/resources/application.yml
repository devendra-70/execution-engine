server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-key: ${JWT_SECRET:changeme-very-long-secret-key-for-dev-only-32chars}

  kafka:
    topic: ${APP_KAFKA_TOPIC:execution-tasks}
    partitions: ${APP_KAFKA_PARTITIONS:50}
    concurrency: ${APP_KAFKA_CONCURRENCY:25}

  execution:
    orchestration-threads: ${APP_EXECUTION_ORCHESTRATION_THREADS:50}
    timeout-ms: ${APP_EXECUTION_TIMEOUT_MS:3000}
    pool:
      warm-min-size: ${APP_EXECUTION_POOL_WARM_MIN_SIZE:5}
      idle-ttl-seconds: ${APP_EXECUTION_POOL_IDLE_TTL_SECONDS:300}
    sandbox:
      memory-limit-mb: ${APP_SANDBOX_MEMORY_LIMIT_MB:256}
      jvm-xms: ${APP_SANDBOX_JVM_XMS:128m}
      jvm-xmx: ${APP_SANDBOX_JVM_XMX:256m}

  redis:
    status-ttl-seconds: ${APP_REDIS_STATUS_TTL_SECONDS:600}
    rate-limit:
      requests-per-minute: ${APP_REDIS_RATE_LIMIT_RPM:5}

  cache:
    testcase-ttl-minutes: ${APP_CACHE_TESTCASE_TTL_MINUTES:60}

  docker:
    host: ${DOCKER_HOST:tcp://localhost:2375}
    sandbox-image: ${SANDBOX_IMAGE:codeval/sandbox-wrapper:latest}
    sandbox-host: ${SANDBOX_HOST:localhost}

spring:
  sql:
    init:
      mode: always                        # run data.sql for non-embedded DBs (PostgreSQL)

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codeval}
    username: ${DB_USER:codeval}
    password: ${DB_PASS:codeval}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false                     # disable OSIV; explicit @Transactional controls session scope
    defer-datasource-initialization: true  # run data.sql AFTER Hibernate creates tables
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: execution-engine

logging:
  level:
    com.epam.execution_engine_service: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
