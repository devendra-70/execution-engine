<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Execution Engine - WebSocket Tester</title>
  <script src="/stomp.umd.min.js"></script>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    h2 { color: #4ec9b0; }
    label { display:block; color: #9cdcfe; margin-top:10px; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0 10px; background: #252526; color: #d4d4d4; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
    textarea { height: 120px; }
    button { padding: 10px 20px; margin-right: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    #btnConnect { background: #0e639c; color: white; }
    #btnDisconnect { background: #6c3d3d; color: white; }
    #btnSubmit { background: #388a34; color: white; }
    #log { background: #0d0d0d; border: 1px solid #333; padding: 12px; height: 300px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; margin-top:10px; }
    .info { color: #569cd6; } .ok { color: #4ec9b0; } .error { color: #f44747; } .result { color: #dcdcaa; } .ts { color: #666; }
    #statusBadge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:12px; background:#6c3d3d; color:white; }
    #statusBadge.connected { background:#388a34; }
  </style>
</head>
<body>
<h2>Execution Engine - WebSocket Tester</h2>
<label>JWT Token:</label>
<input id="token" type="text" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsInN1YiI6InRlc3RAZXhhbXBsZS5jb20iLCJleHAiOjk5OTk5OTk5OTl9.bHCEfpRSF3oSb0POhTXJIjjq_X2gFDC2gq2Ld1MWwbE"/>
<label>WebSocket URL:</label>
<input id="wsUrl" type="text" value="ws://localhost:8080/ws"/>
<div style="margin:12px 0">
  <button id="btnConnect" onclick="doConnect()">Connect</button>
  <button id="btnDisconnect" onclick="doDisconnect()" disabled>Disconnect</button>
  &nbsp; Status: <span id="statusBadge">Disconnected</span>
</div>
<hr style="border-color:#333;margin:20px 0"/>
<h3 style="color:#4ec9b0">Submit Code</h3>
<label>Problem ID:</label><input id="problemId" value="two-sum"/>
<label>Source Code:</label>
<textarea id="sourceCode">public class Solution {
  public static void main(String[] args) {
    System.out.println("Hello from sandbox!");
  }
}</textarea>
<label>Mode:</label><input id="mode" value="RUN"/>
<label>Language:</label><input id="language" value="java21"/>
<div style="margin:12px 0"><button id="btnSubmit" onclick="doSubmit()" disabled>Submit and Watch Result</button></div>
<hr style="border-color:#333;margin:20px 0"/>
<h3 style="color:#4ec9b0">Log</h3>
<div id="log"></div>
<button onclick="document.getElementById('log').innerHTML=''" style="background:#333;color:#aaa;margin-top:8px;padding:6px 14px;border:none;border-radius:4px;cursor:pointer">Clear</button>
<script>
var client=null;
function addLog(m,c){var d=document.getElementById('log'),t=new Date().toLocaleTimeString();d.innerHTML+='<span class="ts">['+t+']</span> <span class="'+(c||'info')+'">'+m+'</span>\n';d.scrollTop=d.scrollHeight;}
function doConnect(){
  if(!window.StompJs){addLog('StompJs not loaded!','error');return;}
  var token=document.getElementById('token').value.trim();
  var url=document.getElementById('wsUrl').value.trim();
  client=new StompJs.Client({brokerURL:url,connectHeaders:{Authorization:'Bearer '+token},reconnectDelay:0,
    onConnect:function(){
      addLog('Connected to '+url,'ok');
      document.getElementById('statusBadge').textContent='Connected';
      document.getElementById('statusBadge').className='connected';
      document.getElementById('btnConnect').disabled=true;
      document.getElementById('btnDisconnect').disabled=false;
      document.getElementById('btnSubmit').disabled=false;
      client.subscribe('/user/queue/execution-results',function(msg){addLog('RESULT:\n'+JSON.stringify(JSON.parse(msg.body),null,2),'result');});
      addLog('Subscribed to /user/queue/execution-results','ok');
    },
    onStompError:function(f){addLog('STOMP error: '+(f.headers?f.headers['message']:f),'error');},
    onWebSocketError:function(e){addLog('WebSocket error: '+e.type,'error');},
    onDisconnect:function(){addLog('Disconnected','info');resetUI();}
  });
  addLog('Connecting to '+url+' ...','info');
  client.activate();
}
function doDisconnect(){if(client)client.deactivate();resetUI();}
function resetUI(){document.getElementById('statusBadge').textContent='Disconnected';document.getElementById('statusBadge').className='';document.getElementById('btnConnect').disabled=false;document.getElementById('btnDisconnect').disabled=true;document.getElementById('btnSubmit').disabled=true;}
function doSubmit(){
  var token=document.getElementById('token').value.trim();
  var body=JSON.stringify({problemId:document.getElementById('problemId').value.trim(),language:document.getElementById('language').value.trim(),mode:document.getElementById('mode').value.trim(),sourceCode:document.getElementById('sourceCode').value});
  addLog('Submitting...','info');
  fetch('/api/executions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body})
  .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
  .then(function(r){if(r.s===202){addLog('Accepted! executionId='+r.d.executionId,'ok');addLog('Waiting for WebSocket result...','info');}else{addLog('HTTP '+r.s+': '+JSON.stringify(r.d),'error');}})
  .catch(function(e){addLog('Fetch error: '+e.message,'error');});
}
</script>
</body>
</html>
