spring.application.name=executionEngine-service-test

# ===============================
# = DATABASE CONFIGURATION (TestContainers PostgreSQL)
# ===============================
# EPMICMPCOD-461: PostgreSQL test database via TestContainers
spring.datasource.url=jdbc:tc:postgresql://localhost/execution_engine_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
# For test environment: create schema automatically
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate batch configuration (SRS §12)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ===============================
# = REDIS CONFIGURATION (Embedded for tests)
# ===============================
spring.redis.host=localhost
spring.redis.port=6379

# ===============================
# = APPLICATION CONFIGURATION
# ===============================
# Redis status cache TTL configuration (SRS §8, §12)
app.redis.status-ttl-seconds=600

# Redis Pub/Sub channel for execution completion notifications (SRS §8)
app.redis.channel=execution-completed

# ===============================
# = KAFKA CONFIGURATION (SRS §5.2)
# ===============================
# Manual ACK mode for Kafka listeners in test profile
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=execution-engine-test-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=executionResultEvent:com.epam.execution_engine_service.persistence.event.ExecutionResultEvent

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.root=WARN
logging.level.com.epam.execution_engine_service=DEBUG
logging.level.org.springframework.data=DEBUG
