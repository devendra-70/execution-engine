spring.application.name=executionEngine-service

# ===============================
# = SPRING FRAMEWORK SETTINGS
# ===============================
spring.main.allow-bean-definition-overriding=true

# ===============================
# = AUTO-CONFIGURATION EXCLUSIONS
# ===============================
# Exclude OAuth2, Kafka and Redis auto-configuration for mock-based tests.
# DataSource and JPA are NOT excluded — H2 is used for persistence tests.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ===============================
# = SECURITY TEST CONFIGURATION
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/.well-known/jwks.json

# ===============================
# = DATABASE CONFIGURATION (H2 for unit tests)
# ===============================
spring.datasource.url=jdbc:h2:mem:execution_engine_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ===============================
# = FLYWAY CONFIGURATION
# ===============================
# Disable Flyway for unit tests (Hibernate DDL manages schema instead)
spring.flyway.enabled=false

# ===============================
# = REDIS STUB SETTINGS (SRS Section 8)
# ===============================
# Connection factory is replaced by a Mockito mock in TestRedisConfiguration.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100ms
spring.data.redis.jedis.pool.enabled=false

# ===============================
# = APPLICATION REDIS CONFIGURATION
# ===============================
app.redis.status-ttl-seconds=600
app.redis.channel=execution-completed

# ===============================
# = KAFKA STUB SETTINGS (SRS Section 7.1)
# ===============================
# KafkaAutoConfiguration is excluded; ProducerFactory is replaced by a mock.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=execution-engine-test-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=executionResultEvent:com.epam.execution_engine_service.persistence.event.ExecutionResultEvent

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.root=WARN
logging.level.com.epam.execution_engine_service=DEBUG
logging.level.org.springframework.data=DEBUG

# ===============================
# = HEALTH PROBE CONFIGURATION (EPMICMPCOD-350)
# ===============================
# Health checks disabled for unit tests (no real Kafka/Redis/DB connectivity required)
app.health.kafka.lag-check-enabled=false
app.health.kafka.check-interval-seconds=30
app.health.kafka.lag-threshold-for-health-records=50000
management.health.kafka.enabled=false
management.health.redis.enabled=false
management.health.db.enabled=true

# ===============================
# = METRICS CONFIGURATION (EPMICMPCOD-350 - 6 Signals)
# ===============================
app.metrics.enabled=true
app.metrics.kafka.lag-threshold-records=1000
app.metrics.kafka.lag-check-interval-seconds=60
app.metrics.cpu.threshold-percent=70
app.metrics.health-check.failure-rate-threshold-percent=10
app.metrics.health-check.window-seconds=300
app.metrics.persistence.failure-rate-threshold-count=5
app.metrics.persistence.window-seconds=60
app.metrics.sandbox-pool.exhaustion-threshold-percent=20
app.metrics.execution.p95-latency-ms-threshold=5000
app.metrics.execution.p99-latency-ms-threshold=3000

# ===============================
# = ACTUATOR & PROMETHEUS CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.kafka=true