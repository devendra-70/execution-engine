spring.application.name=executionEngine-service

# ===============================
# = SPRING FRAMEWORK SETTINGS
# ===============================
# Allow test configurations to override production bean definitions
spring.main.allow-bean-definition-overriding=true

# ===============================
# = AUTO-CONFIGURATION EXCLUSIONS
# ===============================
# Exclude datasource, JPA, OAuth2, Kafka and Redis auto-configuration
# so that no real connections are attempted during tests.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ===============================
# = SECURITY TEST CONFIGURATION
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/.well-known/jwks.json

# ===============================
# = KAFKA STUB SETTINGS (SRS Section 7.1)
# ===============================
# These values are ignored at runtime because KafkaAutoConfiguration is excluded
# and the ProducerFactory is replaced by a Mockito mock in TestKafkaProducerConfiguration.
spring.kafka.bootstrap-servers=localhost:9092

# ===============================
# = REDIS STUB SETTINGS (SRS Section 8)
# ===============================
# These values are ignored at runtime because RedisAutoConfiguration is excluded
# and the connection factory is replaced by a Mockito mock in TestRedisConfiguration.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# = REDIS TEST CONFIGURATION (SRS Section 8)
# ===============================
# Redis is mocked via TestRedisConfiguration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100ms
spring.data.redis.jedis.pool.enabled=false