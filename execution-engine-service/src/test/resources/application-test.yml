spring:
  application:
    name: codeval-execution-engine-test
  
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: execution-engine-test-group
  
  redis:
    host: localhost
    port: 6379

app:
  jwt:
    secret-key: test-secret-key
  
  kafka:
    concurrency: 2
    topic: execution-tasks-test
  
  execution:
    orchestration-threads: 5
    timeout-ms: 1000
    pool:
      warm-min-size: 1
      max-size: 10
  
  redis:
    status-ttl-seconds: 60
    rate-limit:
      requests-per-minute: 100
  
  cache:
    testcase-ttl-minutes: 5
    testcase-max-size: 100

logging:
  level:
    root: WARN
    com.epam.codeval.executionengine: DEBUG
